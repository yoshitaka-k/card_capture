[package]
name = "card_capture"
version = "0.22.1"
edition = "2024"
authors = ["yoshitaka-k"]
description = "Card Capture"
license = "Apache-2.0"

[profile.release]
# 速度最優先（配布サイズより実行速度を重視）
opt-level = 3
# フルLTOよりリンク時間を抑えつつ速度を狙う
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.compact]
# バイナリサイズ最小化を最優先
inherits = "release"
opt-level = "z"
# ソースファイルを1個に合体
lto = true
# 並列コンパイルをやめて、1個の塊として極限まで最適化
codegen-units = 1
# パニック時のエラー追跡用データを全削除
panic = "abort"
# バイナリに含まれるデバッグ用文字（関数名とか）を全削除
strip = true

[dependencies]
color-eyre = "0.6.5"
figlet-rs = "1.0.0"
getset = "0.1.6"
ratatui = "0.30.0"
